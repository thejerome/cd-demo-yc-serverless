name: Deploy the application to YC Serverless Containers
on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Deploy job
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Get Yandex Cloud IAM token
      id: get-iam-token
      uses: docker://ghcr.io/yc-actions/yc-iam-token-fed:1.0.0
      with:
          yc-sa-id: aje81cq6dfoqgk2on12e
    
    - name: Login to Docker Hub
      uses: docker/login-action@v3
      with:
          registry: cr.yandex
          password: ${{ steps.get-iam-token.outputs.token }}
          
    - name: Build, tag, and push image
      env:
        CR_REGISTRY: crptmggr57u83nkgda0h
        CR_REPOSITORY: cd-demo-ys-serverless
        IMAGE_TAG: ${{ github.sha }}
      run: |
               
        # Билд и пуш
        docker build -t cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG .
        docker push cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG
        
