name: Deploy to YC

on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build and push
        env:
          CR_REGISTRY: crptmggr57u83nkgda0h
          CR_REPOSITORY: cd-demo-ys-serverless
          IMAGE_TAG: ${{ github.sha }}
          YC_SA_KEY: ${{ secrets.YC_KEY }}
        run: |
          # Устанавливаем yc CLI
          curl -sSL https://storage.yandexcloud.net/yandexcloud-yc/install.sh | bash -s -- -e
          
          # Сохраняем SA key и получаем токен
          echo "$YC_SA_KEY" > /tmp/sa-key.json
          IAM_TOKEN=$(yc iam create-token --identity service-account-key \
            --service-account-key-path /tmp/sa-key.json --no-interactive)
          
          # Логин
          echo "$IAM_TOKEN" | docker login -u oauth --password-stdin registry.yandex.cloud
          
          # Билд и пуш
          docker build -t cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG .
          docker push cr.yandex/$CR_REGISTRY/$CR_REPOSITORY:$IMAGE_TAG
        
